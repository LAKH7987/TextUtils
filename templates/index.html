
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TextUtils</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

  <!--navbar color dark or light-->  
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <!--link code -->  
        <a class="navbar-brand" href="#">TextUtils.com</a>

        <!--Buttons-->  
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavDropdown">

            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'youtube' %}"> Our Channels </a>
                </li>
                
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'contact' %}">Contact Us</a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#"
                       role="button" data-bs-toggle="dropdown">
                        Dropdown
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Action</a></li>
                        <li><a class="dropdown-item" href="#">Another action</a></li>
                        <li><a class="dropdown-item" href="#">Something else here</a></li>
                    </ul>
                </li>

            </ul>

            <form class="d-flex" role="search">
              
              <!--Search bar--> 
                <input class="form-control me-2" type="search"
                       placeholder="Search" aria-label="Search">

                <button class="btn btn-outline-success" type="submit">
                    Search
                </button>

            </form>

        </div>

    </div>

</nav>
         <!--alerts-->  
<div class="alert alert-success alert-dismissible fade show" role="alert">
  <strong>Welcome to Textutils!</strong> You can do anything write text here..
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>


  <form action="/analyze" method="post">{%csrf_token%}
    <div class="mb-3">
        <!--<label for="textInput" class="form-label">Enter Your Text</label>-->
        <textarea class="form-control" name="text" id="textInput"
                  rows="5" placeholder="Write here..."></textarea>
    </div>

    <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox"
               name="removepunc" id="Custom1">
        <label class="form-check-label" for="removepunc">
            Remove Punctuation
        </label>
    </div>
    
    <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox"
               name="fullcaps" id="Custom2">
        <label class="form-check-label" for="fullcaps">
            UPPERCASE
        </label>
    </div>

    <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox"
               name="newlineremove" id="Custom3">
        <label class="form-check-label" for="newlineremove">
            Remover New Line
        </label>
    </div>

    <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox"
               name="extraspaceremove" id="Custom4">
        <label class="form-check-label" for="extraspaceremove">
            Remover Extra Space
        </label>
    </div>

    <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox"
               name="charcount" id="Custom5">
        <label class="form-check-label" for="charcount">
            Count Character
        </label>
    </div>

<button type="submit" class="btn btn-primary btn-lg"> Analyze Text</button>




</form>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
